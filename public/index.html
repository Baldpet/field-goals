<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFL Field Goals</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="wrap header-row">
      <div>
        <h1>NFL Field Goals <span id="season-label"></span></h1>
        <p class="sub" id="updated">Loading…</p>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="schedule" aria-selected="true">Schedule</button>
        <button role="tab" data-view="kickers" aria-selected="false">Kickers</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="filters">
      <label id="week-filter">Week
        <select id="week"></select>
      </label>
      <label>Team
        <select id="team"><option value="">All teams</option></select>
      </label>
      <label id="min-att-filter" hidden>Min attempts
        <input id="min-att" type="number" min="0" value="5" />
      </label>
    </div>

    <section id="schedule-view"></section>
    <section id="kickers-view" hidden></section>
  </main>

  <footer class="wrap">
    Data: <a href="https://github.com/nflverse">nflverse</a>. Refreshed daily by GitHub Actions. Kickoff times are US Eastern.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
